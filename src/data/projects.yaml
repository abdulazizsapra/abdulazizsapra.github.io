featured:
  - name: COMMAND
    type: Autonomous Business Intelligence Agent
    featured: true
    what: >
      An autonomous AI agent that acts as a real-time operational intelligence
      layer for a multi-market eCommerce business (AU, UK, EU, US). Queries live
      databases, ingests data from five platforms, and delivers decision-grade
      executive briefings on demand — no human preparation required.
    problem: >
      Decision-makers were spending hours manually pulling reports from
      disconnected systems across five markets, with no unified view of
      operations, inventory, or ad performance.
    role: >
      Sole architect and builder. Designed the agent architecture, LLM
      orchestration layer, multi-source data pipeline, cohort retention model,
      and inventory risk system.
    stack: Python, Azure SQL / T-SQL, Claude (LLM Orchestration), Shopify API, Amazon SP API, Meta Ads API, Klaviyo, FiveTran
    outcome: >
      Ingests 430,000+ customer-order records across 5 markets; produces
      autonomous executive briefings covering $6.7M+ AUD YTD revenue, 41,000+
      orders, ad spend efficiency, and supply chain — with zero human
      preparation time. Time-to-insight reduced from hours to seconds.

  - name: Multilingual AI Voice Agents
    type: AI Customer Support Infrastructure
    featured: true
    what: >
      Multilingual Aircall AI voice agents deployed across 6 regional markets,
      each backed by a localised knowledge base built from regional websites,
      product guidance, issue-resolution flows, and FAQ content.
    problem: >
      Several markets were losing a high proportion of inbound calls — UK at
      51%, Germany at 66%, Spain at 68% — with no scalable way to support
      customers outside business hours or in their local language.
    role: >
      Built and configured all 6 market agents. Crawled regional websites,
      extracted product and support knowledge, built multilingual FAQ datasets,
      and coordinated with local country teams to verify translations.
    stack: Aircall AI, Knowledge Base Engineering, Multilingual NLP, Regional Localisation
    outcome: >
      Deployed across AU, UK, FR, DE, IT, and ES; improved AI support
      readiness across all markets; created a scalable multilingual support
      foundation reducing pressure on human customer service teams.

  - name: Dynamic Checkout Messaging App
    type: Shopify App — EU Stores
    featured: true
    what: >
      A custom Shopify app that dynamically displays delivery guidance at
      checkout based on shipping method, product type, variant, and
      store-specific rules across multiple EU stores.
    problem: >
      Customers were selecting locker delivery for orders containing oversized
      cartons that physically could not fit in a locker, causing failed
      deliveries, returns, and avoidable support tickets after the order.
    role: >
      Sole developer. Designed the hybrid data architecture, built the
      rule engine, and implemented multi-store configuration support.
    stack: Shopify (Metafields, App Extensions), Node.js, Prisma, JavaScript
    outcome: >
      Prevents unsuitable locker delivery selections at the point of
      purchase; reduced avoidable delivery failures and returns; reusable
      across multiple EU stores with flexible per-store configuration.

  - name: SnapshotHub
    url: https://snapshothub.au/
    type: AI Photography Marketplace
    featured: true
    what: >
      Marketplace where event photographers upload photos and attendees find
      themselves via AI facial recognition.
    problem: >
      Manual sorting of thousands of event photos was slow and error-prone.
    role: >
      Sole developer. Architected system, built Laravel backend, integrated
      AWS Rekognition, designed multi-photographer workflow.
    stack: Laravel, PHP, AWS (S3, Rekognition), MySQL, Tailwind
    outcome: >
      Manual photo sorting reduced by 80%; photographers tag thousands of
      photos automatically.

  - name: Bitcoin ATM Platform
    type: Fintech Infrastructure
    featured: true
    what: >
      Backend software for a Bitcoin ATM network: real-time wallet integrations,
      Lightning Network support, and automated transaction monitoring.
    problem: >
      Reliable, secure transaction processing with minimal failed transactions
      at scale across multiple exchange integrations.
    role: >
      Software engineer. Transaction processing, exchange API integrations,
      error handling, and monitoring systems.
    stack: Node.js, Python, Supabase, Bitcoin APIs, Lightning Network (OpenNode)
    outcome: >
      Zero security incidents in production; sub-second Lightning transactions;
      reduced failed transaction rates through automated monitoring.

