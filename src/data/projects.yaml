featured:
  - name: SnapshotHub
    url: https://snapshothub.au/
    type: AI Photography Marketplace
    featured: true
    what: >
      Marketplace where event photographers upload photos and attendees find
      themselves via AI facial recognition.
    problem: >
      Manual sorting of thousands of event photos was slow and error-prone.
    role: >
      Sole developer. Architected system, built Laravel backend, integrated
      AWS Rekognition, designed multi-photographer workflow.
    stack: Laravel, PHP, AWS (S3, Rekognition), MySQL, Tailwind
    outcome: >
      Manual photo sorting reduced by 80%; photographers tag thousands of
      photos automatically.

  - name: SmartTech Australia
    url: https://smarttechaustralia.com.au/
    type: Enterprise WordPress
    what: >
      Full rebuild of 200+ page enterprise website for a technology services
      company.
    problem: >
      Legacy site needed modernisation, SEO preservation, and zero-downtime
      migration.
    role: >
      Lead developer. Migration, custom theme, SEO preservation strategy.
    stack: WordPress, PHP, Custom Theme, ACF
    outcome: >
      Delivered in 4 weeks with zero downtime; company fully booked for
      2 months post-launch.

  - name: DiveBookings.com
    url: https://divebookings.com/
    type: Shopify Multi-vendor Marketplace
    what: >
      Booking platform connecting divers with scuba, freediving, and
      spearfishing operators across multiple locations.
    problem: >
      Operators needed a single place to list and manage bookings; customers
      needed unified discovery and payment.
    role: >
      Full stack developer. Custom Shopify theme, booking integration, vendor
      management dashboard.
    stack: Shopify (Liquid), JavaScript, Custom API Integrations
    outcome: >
      15+ dive operators onboarded; unified booking and payment across
      all vendors.

  - name: Bitcoin ATM Platform
    type: Fintech Infrastructure
    what: >
      Backend software for a Bitcoin ATM network: real-time wallet integrations,
      Lightning Network support.
    problem: >
      Reliable, secure transaction processing and minimal failed transactions
      at scale.
    role: >
      Software engineer. Transaction processing, exchange API integrations,
      security protocols.
    stack: Node.js, Python, Supabase, Bitcoin APIs, Lightning Network
    outcome: >
      Zero security incidents in production; sub-second Lightning
      transactions; reduced failed transaction rates.

  - name: TMWYGT
    url: https://tmwygt.com/
    type: Cross-platform Mobile App
    what: >
      Personal safety app that texts your contacts when you arrive at a
      destination.
    problem: >
      Users wanted automatic arrival notifications without manual check-ins.
    role: >
      Lead developer. Full app: geofencing, SMS integration, subscription
      billing.
    stack: React Native, Node.js, MongoDB, Google APIs, Stripe
    outcome: >
      Beta shipped to TestFlight and Google Play; 95%+ geofence accuracy.

  - name: PetSavers.com.au
    url: https://petsavers.com.au/
    type: Shopify eCommerce
    what: >
      Full-featured online pet store: large catalog, inventory management,
      shipping integrations.
    problem: >
      Client needed a scalable store with 2,000+ SKUs and supplier inventory
      sync.
    role: >
      Full stack developer. Custom theme, product catalog, payment and
      shipping integrations.
    stack: Shopify, Liquid, JavaScript
    outcome: >
      2,000+ SKUs launched in 3 months; full inventory sync with supplier
      systems.

