summary: >
  I design and deploy autonomous AI agents that replace manual reporting and
  operational overhead. My current work involves building COMMAND — an autonomous
  business intelligence agent ingesting 430K+ customer records across 5 markets,
  producing executive-grade analysis with zero human preparation time. I work at
  the intersection of LLM orchestration, data engineering, and business strategy.
  Not dashboards. Decisions. Still curious. Still building.

about:
  - >
    I'm an AI & Automation Solutions Architect specialising in autonomous agent
    systems and operational intelligence. I build AI that doesn't just assist —
    it acts. My focus is replacing manual reporting, fragmented data, and
    repetitive operations with systems that run end-to-end, surface the right
    information, and free teams to make faster decisions.
  - >
    My current work centres on LLM orchestration, multi-source data pipelines,
    and commerce automation across multi-market eCommerce operations. I've built
    autonomous agents ingesting 430K+ records across Shopify, Amazon, Meta,
    and Klaviyo; modelled 8 years of cohort retention data; and automated
    intelligence covering $6.7M+ AUD in revenue. I hold a Master of ICT and
    bring an outcome-first approach to every system I build.

