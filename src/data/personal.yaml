how_i_work:
  - Automation-first mindset; if it's done repeatedly by a human, it should be a system.
  - Systems thinking over feature delivery; design for reliability and scale from day one.
  - Business-aware architecture; operational efficiency and ROI drive every decision.
  - Clear communication with stakeholders, ops teams, and non-technical decision-makers.
  - End-to-end ownership; from design and build through to deployment and monitoring.
  - Pragmatic tool choices; right fit for the job, not the trendiest option.

